name: Track B high-core exactness and scored comparison
on:
  push:
    branches: [track-b/highcore-qualification-11]
    paths: [track-b/main.cpp, .github/workflows/track-b-highcore-qualify.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: track-b-highcore-qualification
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pinned organizer and immutable production builds
        run: |
          set -euo pipefail
          git clone https://github.com/hackathon-raptors/speed-demon-2026.git /tmp/organizer
          git -C /tmp/organizer checkout 3e365d15d9905a0d73c9f05207d434a654666d3c
          docker pull gcc:15@sha256:eb5e64286ad47187b32bda75c6b6916166ecb41da56559b8b09e0001748d2cce
          docker pull debian:13-slim@sha256:62bd423aeee912639ca8ee681c2b762cb3e25137e0a92b20be455898a9f034ad
          mkdir -p /tmp/previous /tmp/bin /tmp/evidence
          cp track-b/Dockerfile /tmp/previous/
          git show f55c2715406a4dbfb2960b3feac15db0968bf4c4:track-b/main.cpp > /tmp/previous/main.cpp
          docker build --network=none -t frontier:previous /tmp/previous
          docker build --network=none -t frontier:candidate track-b
          gcc -O2 -static /tmp/organizer/harness/timer/sd-timer.c -o /tmp/bin/sd-timer
          g++ -std=c++20 -O3 -march=x86-64-v3 -pthread -Wall -Wextra track-b/main.cpp -o /tmp/bin/candidate
      - name: Differential, adversarial and sanitizers
        run: |
          set -euo pipefail
          python3 tests/differential.py /tmp/bin/candidate
          python3 tests/frontier_adversarial.py /tmp/bin/candidate
          g++ -std=c++20 -O1 -g -march=x86-64-v3 -pthread -fsanitize=address,undefined -fno-omit-frame-pointer -fno-pie -no-pie track-b/main.cpp -o /tmp/bin/sanitized
          python3 tests/differential.py /tmp/bin/sanitized
          python3 tests/frontier_adversarial.py /tmp/bin/sanitized
          g++ -std=c++20 -O1 -g -march=x86-64-v3 -pthread -fsanitize=thread -fno-omit-frame-pointer -fno-pie -no-pie track-b/main.cpp -o /tmp/bin/thread-sanitized
          TSAN_OPTIONS=halt_on_error=1 python3 tests/frontier_adversarial.py /tmp/bin/thread-sanitized
      - name: Three full seeds and pinned offline Docker timings
        run: |
          set -euo pipefail
          for seed in 1 2 3; do
            python3 /tmp/organizer/generators/b_index.py --seed "$seed" --scale full --out "/tmp/data-$seed"
            if [ "$seed" = 1 ]; then
              expected=f86973c210228141bcb6f1f1b10188ad2a9b65f71e7cd7cf4590b38de4e80927
            else
              python3 /tmp/organizer/reference/b_index.py --data "/tmp/data-$seed" --out "/tmp/ref-$seed"
              expected=$(sha256sum "/tmp/ref-$seed/results.txt" | cut -d' ' -f1)
            fi
            sudo python3 experiments/frontier/compare.py --data "/tmp/data-$seed" --expected "$expected" --timer /tmp/bin/sd-timer --seed "$seed" --results /tmp/evidence/measurements.jsonl frontier:previous frontier:candidate
          done
          python3 /tmp/organizer/generators/b_index.py --seed 1 --scale sample --out /tmp/sample
          sudo python3 experiments/frontier/compare.py --data /tmp/sample --expected eeeec1e9319da98a6f3c664c78f93e7078fd603c25c2bb3027174e81e3638a8f --timer /tmp/bin/sd-timer --seed 1 --repeat 1 --results /tmp/evidence/sample.jsonl frontier:candidate
      - name: Canonical source and local score comparison
        run: |
          set -euo pipefail
          python3 -m pip install clang-format==23.1.3
          curl -fL https://github.com/boyter/scc/releases/download/v4.1.0/scc_Linux_x86_64.tar.gz -o /tmp/scc.tar.gz
          echo 'c7328436d3027f4357d3d7853f7dc3ac2bbcb4ca08f1adad91a27c593884079b  /tmp/scc.tar.gz' | sha256sum -c -
          tar -xzf /tmp/scc.tar.gz -C /tmp/bin scc
          for variant in previous candidate; do
            mkdir -p "/tmp/count-$variant"
            if [ "$variant" = previous ]; then source=/tmp/previous/main.cpp; else source=track-b/main.cpp; fi
            clang-format --style=LLVM "$source" > "/tmp/count-$variant/main.cpp"
            cp track-b/Dockerfile "/tmp/count-$variant/"
            /tmp/bin/scc --format json "/tmp/count-$variant" > "/tmp/evidence/static-$variant.json"
          done
          python3 - <<'PY'
          import json, statistics, sys
          from pathlib import Path
          sys.path.insert(0, '/tmp/organizer/harness')
          from scoring import k_from_measurements
          root=Path('/tmp/evidence')
          rows=[json.loads(x) for x in (root/'measurements.jsonl').read_text().splitlines()]
          cal=json.loads(Path('/tmp/organizer/harness/calibration-seed1.json').read_text())['tracks']['b']
          ref=dict(T=cal['T_ref_s'],M=cal['M_ref_bytes'],S=91,D=1)
          ratios=[]
          for seed in (1,2,3):
              ks={}
              for variant in ('previous','candidate'):
                  subset=[x for x in rows if x['seed']==seed and x['image']=='frontier:'+variant]
                  static=json.loads((root/('static-'+variant+'.json')).read_text())
                  axes=dict(T=statistics.median(x['T'] for x in subset),M=max(x['M'] for x in subset),S=sum(x['Code'] for x in static),D=1)
                  ks[variant]=k_from_measurements(ref,axes)
                  print(json.dumps(dict(seed=seed,variant=variant,**axes,K_local=ks[variant])))
              ratios.append(ks['candidate']/ks['previous'])
          print('K_RATIOS',ratios)
          assert sum(x>1 for x in ratios)>=2 and min(ratios)>=0.98, 'insufficient scoring improvement'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: track-b-highcore-evidence
          path: /tmp/evidence/
