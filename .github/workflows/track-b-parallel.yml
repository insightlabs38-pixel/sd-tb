name: Track B parallel-index comparison
on:
  push:
    branches: [main]
    paths: [.github/workflows/track-b-parallel.yml]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: track-b-parallel
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Publish pending comparison run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -d "{\"state\":\"pending\",\"context\":\"track-b/parallel\",\"description\":\"Parallel-index comparison running\",\"target_url\":\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}"
      - name: Prepare reference and parallel variants
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/hackathon-raptors/speed-demon-2026.git /tmp/sd-organizer
          python3 experiments/parallel_index.py track-b/main.cpp /tmp/parallel-4.cpp
          sed 's/min<size_t>(4, cores)/min<size_t>(2, cores)/' /tmp/parallel-4.cpp > /tmp/parallel-2.cpp
          sed 's/min<size_t>(4, cores)/min<size_t>(8, cores)/' /tmp/parallel-4.cpp > /tmp/parallel-8.cpp
          for n in 2 4 8; do
            g++ -std=c++20 -O3 -DNDEBUG -pthread -Wall -Wextra "/tmp/parallel-$n.cpp" -o "/tmp/parallel-$n"
          done
          g++ -std=c++20 -O3 -DNDEBUG -pthread -Wall -Wextra track-b/main.cpp -o /tmp/parallel-serial
          python3 tests/differential.py /tmp/parallel-4
      - name: Generate full independent datasets and reference
        run: |
          set -euo pipefail
          for seed in 1 2; do
            python3 /tmp/sd-organizer/generators/b_index.py --seed "$seed" --scale full --out "/tmp/parallel-data-$seed"
          done
          mkdir -p /tmp/parallel-ref-2
          python3 /tmp/sd-organizer/reference/b_index.py --data /tmp/parallel-data-2 --out /tmp/parallel-ref-2
      - name: Compare serial and parallel worker counts with exact output
        run: |
          set -euo pipefail
          mkdir -p /tmp/parallel-output
          for seed in 1 2; do
            for repeat in 1 2; do
              for variant in serial 2 4 8; do
                echo "PARALLEL_COMPARE seed=$seed repeat=$repeat variant=$variant"
                /usr/bin/time -f 'WALL_SECONDS=%e PEAK_RSS_KB=%M' \
                  "/tmp/parallel-$variant" --data "/tmp/parallel-data-$seed" --out /tmp/parallel-output
                if [ "$seed" = 1 ]; then
                  echo 'f86973c210228141bcb6f1f1b10188ad2a9b65f71e7cd7cf4590b38de4e80927  /tmp/parallel-output/results.txt' | sha256sum -c -
                else
                  cmp /tmp/parallel-output/results.txt /tmp/parallel-ref-2/results.txt
                fi
              done
            done
          done
      - name: Publish comparison status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then state=success; else state=failure; fi
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -d "{\"state\":\"$state\",\"context\":\"track-b/parallel\",\"description\":\"Full-seed parallel-index comparison\",\"target_url\":\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}"
