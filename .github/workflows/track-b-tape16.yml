name: Track B 16-bit tape qualification
on:
  push:
    branches: [main]
    paths: [.github/workflows/track-b-tape16.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: track-b-tape16
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build isolated candidate and run differential oracle
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/hackathon-raptors/speed-demon-2026.git /tmp/t16-organizer
          python3 -m py_compile experiments/tape16.py
          python3 experiments/tape16.py track-b/main.cpp /tmp/t16-challenger.cpp
          g++ -std=c++20 -O3 -flto -march=x86-64-v3 -DNDEBUG -pthread -Wall -Wextra track-b/main.cpp -o /tmp/t16-base
          g++ -std=c++20 -O3 -flto -march=x86-64-v3 -DNDEBUG -pthread -Wall -Wextra /tmp/t16-challenger.cpp -o /tmp/t16-challenger
          python3 tests/differential.py /tmp/t16-challenger
      - name: Generate full seeds and independent reference
        run: |
          set -euo pipefail
          for seed in 1 2; do
            python3 /tmp/t16-organizer/generators/b_index.py --seed "$seed" --scale full --out "/tmp/t16-data-$seed"
          done
          mkdir -p /tmp/t16-ref-2
          python3 /tmp/t16-organizer/reference/b_index.py --data /tmp/t16-data-2 --out /tmp/t16-ref-2
      - name: Three paired full-seed comparisons
        run: |
          set -euo pipefail
          mkdir -p /tmp/t16-out
          for seed in 1 2; do
            for repeat in 1 2 3; do
              for variant in base challenger; do
                echo "T16_COMPARE seed=$seed repeat=$repeat variant=$variant"
                /usr/bin/time -f 'WALL_SECONDS=%e PEAK_RSS_KB=%M' \
                  "/tmp/t16-$variant" --data "/tmp/t16-data-$seed" --out /tmp/t16-out
                if [ "$seed" = 1 ]; then
                  echo 'f86973c210228141bcb6f1f1b10188ad2a9b65f71e7cd7cf4590b38de4e80927  /tmp/t16-out/results.txt' | sha256sum -c -
                else
                  cmp /tmp/t16-out/results.txt /tmp/t16-ref-2/results.txt
                fi
              done
            done
          done
      - name: Validate 32-bit fallback above 65535 query terms
        run: |
          set -euo pipefail
          mkdir -p /tmp/t16-fallback/data /tmp/t16-fallback/base /tmp/t16-fallback/new
          python3 - <<'PY'
          from pathlib import Path
          root = Path('/tmp/t16-fallback/data')
          (root / 'docs.txt').write_text('0\ttok0 tok40000\n1\ttok1\n')
          (root / 'queries.txt').write_text(''.join(
              f'BOOL tok{i} OR tok{i+40000}\n' for i in range(40000)))
          PY
          /tmp/t16-base --data /tmp/t16-fallback/data --out /tmp/t16-fallback/base
          /tmp/t16-challenger --data /tmp/t16-fallback/data --out /tmp/t16-fallback/new
          cmp /tmp/t16-fallback/base/results.txt /tmp/t16-fallback/new/results.txt
      - name: Pinned offline Docker and unprivileged sample
        run: |
          set -euo pipefail
          python3 /tmp/t16-organizer/generators/b_index.py --seed 1 --scale sample --out /tmp/t16-sample
          mkdir -p /tmp/t16-docker /tmp/t16-docker-out
          chmod 777 /tmp/t16-docker-out
          cp track-b/Dockerfile /tmp/t16-docker/Dockerfile
          cp /tmp/t16-challenger.cpp /tmp/t16-docker/main.cpp
          docker build --network=none -t sd-t16:verify /tmp/t16-docker
          docker run --rm --user 65534:65534 --network=none --read-only \
            -v /tmp/t16-sample:/data:ro -v /tmp/t16-docker-out:/out:rw sd-t16:verify
          echo 'eeeec1e9319da98a6f3c664c78f93e7078fd603c25c2bb3027174e81e3638a8f  /tmp/t16-docker-out/results.txt' | sha256sum -c -
