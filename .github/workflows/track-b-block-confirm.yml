name: Track B block-size confirmation
on:
  push:
    branches: [track-b/block-size-fine-11]
    paths: [.github/workflows/track-b-block-confirm.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: track-b-block-confirm
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned variants
        run: |
          set -euo pipefail
          git clone https://github.com/hackathon-raptors/speed-demon-2026.git /tmp/organizer
          git -C /tmp/organizer checkout 3e365d15d9905a0d73c9f05207d434a654666d3c
          mkdir -p /tmp/bin /tmp/evidence
          docker pull gcc:15@sha256:eb5e64286ad47187b32bda75c6b6916166ecb41da56559b8b09e0001748d2cce
          docker pull debian:13-slim@sha256:62bd423aeee912639ca8ee681c2b762cb3e25137e0a92b20be455898a9f034ad
          gcc -O2 -static /tmp/organizer/harness/timer/sd-timer.c -o /tmp/bin/sd-timer
          for size in 1024 1152 1280; do
            mkdir -p "/tmp/b$size"
            cp track-b/Dockerfile "/tmp/b$size/Dockerfile"
            python3 - "$size" <<'PY'
          import sys
          from pathlib import Path
          size = sys.argv[1]
          source = Path("track-b/main.cpp").read_text()
          assert source.count("scan_corpus<1024>(docs_file, workers)") == 1
          Path(f"/tmp/b{size}/main.cpp").write_text(
              source.replace("scan_corpus<1024>(docs_file, workers)",
                             f"scan_corpus<{size}>(docs_file, workers)"))
          PY
            docker build --network=none -t "frontier:b$size" "/tmp/b$size"
          done
      - name: Independent references and paired seven-repeat full timings
        run: |
          set -euo pipefail
          for seed in 1 2 3 42 123; do
            python3 /tmp/organizer/generators/b_index.py --seed "$seed" --scale full --out "/tmp/data-$seed"
            if [ "$seed" = 1 ]; then
              expected=f86973c210228141bcb6f1f1b10188ad2a9b65f71e7cd7cf4590b38de4e80927
            else
              python3 /tmp/organizer/reference/b_index.py --data "/tmp/data-$seed" --out "/tmp/ref-$seed"
              expected=$(sha256sum "/tmp/ref-$seed/results.txt" | cut -d' ' -f1)
            fi
            sudo python3 experiments/frontier/compare.py --data "/tmp/data-$seed" --expected "$expected" --timer /tmp/bin/sd-timer --seed "$seed" --repeat 7 --results /tmp/evidence/measurements.jsonl frontier:b1024 frontier:b1152 frontier:b1280
          done
      - name: Canonical K and paired statistics
        run: |
          set -euo pipefail
          python3 -m pip install clang-format==23.1.3
          curl -fL https://github.com/boyter/scc/releases/download/v4.1.0/scc_Linux_x86_64.tar.gz -o /tmp/scc.tar.gz
          echo 'c7328436d3027f4357d3d7853f7dc3ac2bbcb4ca08f1adad91a27c593884079b  /tmp/scc.tar.gz' | sha256sum -c -
          tar -xzf /tmp/scc.tar.gz -C /tmp/bin scc
          mkdir -p /tmp/count
          clang-format --style=LLVM track-b/main.cpp > /tmp/count/main.cpp
          cp track-b/Dockerfile /tmp/count/
          /tmp/bin/scc --format json /tmp/count > /tmp/evidence/static.json
          python3 - <<'PY'
          import json, math, statistics, sys
          from pathlib import Path
          sys.path.insert(0, "/tmp/organizer/harness")
          from scoring import k_from_measurements
          root = Path("/tmp/evidence")
          rows = [json.loads(x) for x in (root / "measurements.jsonl").read_text().splitlines()]
          calibration = json.loads(Path("/tmp/organizer/harness/calibration-seed1.json").read_text())["tracks"]["b"]
          reference = dict(T=calibration["T_ref_s"], M=calibration["M_ref_bytes"], S=91, D=1)
          S = sum(x["Code"] for x in json.loads((root / "static.json").read_text()))
          ratios = {1152: [], 1280: []}
          for seed in (1, 2, 3, 42, 123):
              scores = {}
              for size in (1024, 1152, 1280):
                  selected = [x for x in rows if x["seed"] == seed and x["image"] == f"frontier:b{size}"]
                  assert len(selected) == 7, (seed, size, len(selected))
                  axes = dict(T=statistics.median(x["T"] for x in selected), M=max(x["M"] for x in selected), S=S, D=1)
                  scores[size] = k_from_measurements(reference, axes)
                  print(json.dumps(dict(seed=seed, size=size, **axes, K_local=scores[size])), flush=True)
              for size in ratios:
                  ratio = scores[size] / scores[1024]
                  ratios[size].append(ratio)
                  print(f"seed {seed} size {size} K ratio to 1024: {ratio:.8f}", flush=True)
          for size, vals in ratios.items():
              geomean = math.exp(statistics.mean(math.log(v) for v in vals))
              print(f"size {size}: geomean K ratio {geomean:.8f}, seed wins {sum(v>1 for v in vals)}/5", flush=True)
          print("Runner-local estimates only, not official board scores.", flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: track-b-block-confirm-evidence
          path: /tmp/evidence/
