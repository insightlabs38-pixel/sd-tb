name: Frontier B parameter sweep
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Organizer, images and variants
        run: |
          set -euo pipefail
          git clone https://github.com/hackathon-raptors/speed-demon-2026.git /tmp/organizer
          git -C /tmp/organizer checkout 3e365d15d9905a0d73c9f05207d434a654666d3c
          docker pull gcc:15@sha256:eb5e64286ad47187b32bda75c6b6916166ecb41da56559b8b09e0001748d2cce
          docker pull debian:13-slim@sha256:62bd423aeee912639ca8ee681c2b762cb3e25137e0a92b20be455898a9f034ad
          mkdir -p /tmp/bin /tmp/evidence
          gcc -O2 -static /tmp/organizer/harness/timer/sd-timer.c -o /tmp/bin/sd-timer
          python3 -m pip install clang-format==23.1.3
          curl -fL https://github.com/boyter/scc/releases/download/v4.1.0/scc_Linux_x86_64.tar.gz -o /tmp/scc.tar.gz
          echo 'c7328436d3027f4357d3d7853f7dc3ac2bbcb4ca08f1adad91a27c593884079b  /tmp/scc.tar.gz' | sha256sum -c -
          tar -xzf /tmp/scc.tar.gz -C /tmp/bin scc
          variant() { # name, sed expression
            mkdir -p "/tmp/v-$1"; cp track-b/Dockerfile "/tmp/v-$1/"
            sed "$2" track-b/main.cpp > "/tmp/v-$1/main.cpp"
            cmp -s track-b/main.cpp "/tmp/v-$1/main.cpp" && [ "$1" != base ] && { echo "variant $1 changed nothing"; exit 1; }
            docker build --network=none -t "frontier:$1" "/tmp/v-$1"
            mkdir -p "/tmp/count-$1"; clang-format --style=LLVM "/tmp/v-$1/main.cpp" > "/tmp/count-$1/main.cpp"
            cp track-b/Dockerfile "/tmp/count-$1/"; /tmp/bin/scc --format json "/tmp/count-$1" > "/tmp/evidence/static-$1.json"
          }
          variant base 's/^$//'
          variant hot1500 's/hot_cap = 3000/hot_cap = 1500/'
          variant hot2000 's/hot_cap = 3000/hot_cap = 2000/'
          variant min8 's/hot_min = 4/hot_min = 8/'
          variant block1536 's/scan_corpus<2048>/scan_corpus<1536>/'
          variant sample256 's/sample_bytes = 512u << 10/sample_bytes = 256u << 10/'
          variant workers6 's/? 12 : 1/? 6 : 1/'
          variant workers4 's/? 12 : 1/? 4 : 1/'
          git show d7845bc6ac6a77547121daf1fda751e34999b325:track-b/main.cpp > /tmp/champion.cpp
          mkdir -p /tmp/v-champion /tmp/count-champion; cp track-b/Dockerfile /tmp/v-champion/ /tmp/count-champion/; cp /tmp/champion.cpp /tmp/v-champion/main.cpp
          docker build --network=none -t frontier:champion /tmp/v-champion
          clang-format --style=LLVM /tmp/champion.cpp > /tmp/count-champion/main.cpp; /tmp/bin/scc --format json /tmp/count-champion > /tmp/evidence/static-champion.json
      - name: Corpora
        run: |
          set -euo pipefail
          for seed in 1 2; do python3 /tmp/organizer/generators/b_index.py --seed "$seed" --scale full --out "/tmp/data-$seed"; done
          python3 /tmp/organizer/reference/b_index.py --data /tmp/data-2 --out /tmp/ref-2
      - name: Measurements
        run: |
          set -euo pipefail
          for seed in 1 2; do
            if [ "$seed" = 1 ]; then expected=f86973c210228141bcb6f1f1b10188ad2a9b65f71e7cd7cf4590b38de4e80927
            else expected=$(sha256sum /tmp/ref-2/results.txt | cut -d' ' -f1); fi
            sudo python3 experiments/frontier/compare.py --data "/tmp/data-$seed" --expected "$expected" --timer /tmp/bin/sd-timer --seed "$seed" --repeat 7 --results /tmp/evidence/measurements.jsonl frontier:champion frontier:base frontier:hot1500 frontier:hot2000 frontier:min8 frontier:block1536 frontier:sample256 frontier:workers6 frontier:workers4
          done
          python3 experiments/frontier/summarize_variants.py /tmp/evidence | tee /tmp/evidence/summary.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontier-b-claude-sweep
          path: /tmp/evidence/
