name: Track B fingerprint-filter comparison
on:
  push:
    branches: [experiment/bloom-lookup]
    paths: [.github/workflows/track-b-bloom.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: track-b-bloom
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Compile and differential-test the two candidates
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/hackathon-raptors/speed-demon-2026.git /tmp/bloom-organizer
          g++ -std=c++20 -O3 -flto -march=x86-64-v3 -DNDEBUG -pthread -Wall -Wextra track-b/main.cpp -o /tmp/bloom-base
          python3 -m py_compile experiments/bloom_lookup.py
          for variant in one two; do
            python3 experiments/bloom_lookup.py track-b/main.cpp "/tmp/bloom-$variant.cpp" "$variant"
            g++ -std=c++20 -O3 -flto -march=x86-64-v3 -DNDEBUG -pthread -Wall -Wextra "/tmp/bloom-$variant.cpp" -o "/tmp/bloom-$variant"
            python3 tests/differential.py "/tmp/bloom-$variant"
          done
      - name: Generate full seeds and independent oracle
        run: |
          set -euo pipefail
          for seed in 1 2; do
            python3 /tmp/bloom-organizer/generators/b_index.py --seed "$seed" --scale full --out "/tmp/bloom-data-$seed"
          done
          mkdir -p /tmp/bloom-ref-2
          python3 /tmp/bloom-organizer/reference/b_index.py --data /tmp/bloom-data-2 --out /tmp/bloom-ref-2
      - name: Interleaved exact full-seed comparisons
        run: |
          set -euo pipefail
          mkdir -p /tmp/bloom-out
          for seed in 1 2; do
            for repeat in 1 2 3; do
              for variant in base one two; do
                echo "BLOOM_COMPARE seed=$seed repeat=$repeat variant=$variant"
                /usr/bin/time -f 'WALL_SECONDS=%e PEAK_RSS_KB=%M' \
                  "/tmp/bloom-$variant" --data "/tmp/bloom-data-$seed" --out /tmp/bloom-out
                if [ "$seed" = 1 ]; then
                  echo 'f86973c210228141bcb6f1f1b10188ad2a9b65f71e7cd7cf4590b38de4e80927  /tmp/bloom-out/results.txt' | sha256sum -c -
                else
                  cmp /tmp/bloom-out/results.txt /tmp/bloom-ref-2/results.txt
                fi
              done
            done
          done
      - name: Pinned offline Docker smoke test for two-probe candidate
        run: |
          set -euo pipefail
          python3 /tmp/bloom-organizer/generators/b_index.py --seed 1 --scale sample --out /tmp/bloom-sample
          mkdir -p /tmp/bloom-docker /tmp/bloom-docker-out
          chmod 777 /tmp/bloom-docker-out
          cp track-b/Dockerfile /tmp/bloom-docker/Dockerfile
          cp /tmp/bloom-two.cpp /tmp/bloom-docker/main.cpp
          docker build --network=none -t sd-bloom:verify /tmp/bloom-docker
          docker run --rm --user 65534:65534 --network=none --read-only \
            -v /tmp/bloom-sample:/data:ro -v /tmp/bloom-docker-out:/out:rw \
            sd-bloom:verify
          echo 'eeeec1e9319da98a6f3c664c78f93e7078fd603c25c2bb3027174e81e3638a8f  /tmp/bloom-docker-out/results.txt' | sha256sum -c -
