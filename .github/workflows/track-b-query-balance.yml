name: Track B query work-stealing independent repeat
on:
  push:
    branches: [main]
    paths: [.github/workflows/track-b-query-balance.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: track-b-query-balance
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare three independent work-stealing variants
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/hackathon-raptors/speed-demon-2026.git /tmp/qb-organizer
          python3 -m py_compile experiments/tape_query.py
          g++ -std=c++20 -O3 -flto -march=x86-64-v3 -DNDEBUG -pthread -Wall -Wextra track-b/main.cpp -o /tmp/qb-base
          for variant in dynamic16 dynamic dynamic256; do
            python3 experiments/tape_query.py track-b/main.cpp "/tmp/qb-$variant.cpp" "$variant"
            g++ -std=c++20 -O3 -flto -march=x86-64-v3 -DNDEBUG -pthread -Wall -Wextra "/tmp/qb-$variant.cpp" -o "/tmp/qb-$variant"
            python3 tests/differential.py "/tmp/qb-$variant"
          done
      - name: Generate two full seeds and independent reference
        run: |
          set -euo pipefail
          for seed in 1 2; do
            python3 /tmp/qb-organizer/generators/b_index.py --seed "$seed" --scale full --out "/tmp/qb-data-$seed"
          done
          mkdir -p /tmp/qb-ref-2
          python3 /tmp/qb-organizer/reference/b_index.py --data /tmp/qb-data-2 --out /tmp/qb-ref-2
      - name: Interleaved full-seed exactness and timing
        run: |
          set -euo pipefail
          mkdir -p /tmp/qb-out
          for seed in 1 2; do
            for repeat in 1 2 3; do
              for variant in base dynamic16 dynamic dynamic256; do
                echo "QB_COMPARE seed=$seed repeat=$repeat variant=$variant"
                /usr/bin/time -f 'WALL_SECONDS=%e PEAK_RSS_KB=%M' \
                  "/tmp/qb-$variant" --data "/tmp/qb-data-$seed" --out /tmp/qb-out
                if [ "$seed" = 1 ]; then
                  echo 'f86973c210228141bcb6f1f1b10188ad2a9b65f71e7cd7cf4590b38de4e80927  /tmp/qb-out/results.txt' | sha256sum -c -
                else
                  cmp /tmp/qb-out/results.txt /tmp/qb-ref-2/results.txt
                fi
              done
            done
          done
      - name: Offline Docker and unprivileged sample for dynamic-64
        run: |
          set -euo pipefail
          python3 /tmp/qb-organizer/generators/b_index.py --seed 1 --scale sample --out /tmp/qb-sample
          mkdir -p /tmp/qb-docker /tmp/qb-docker-out
          cp track-b/Dockerfile /tmp/qb-docker/Dockerfile
          cp /tmp/qb-dynamic.cpp /tmp/qb-docker/main.cpp
          docker build --network=none -t sd-qb-dynamic:verify /tmp/qb-docker
          chmod 777 /tmp/qb-docker-out
          docker run --rm --user 65534:65534 --network=none --read-only \
            -v /tmp/qb-sample:/data:ro -v /tmp/qb-docker-out:/out:rw \
            sd-qb-dynamic:verify
          echo 'eeeec1e9319da98a6f3c664c78f93e7078fd603c25c2bb3027174e81e3638a8f  /tmp/qb-docker-out/results.txt' | sha256sum -c -
