name: Track B adaptive intersection comparison
on:
  push:
    branches: [main]
    paths: [.github/workflows/track-b-gallop.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: track-b-gallop
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare reference and intersection variants
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/hackathon-raptors/speed-demon-2026.git /tmp/sd-organizer
          g++ -std=c++20 -O3 -DNDEBUG -pthread -Wall -Wextra track-b/main.cpp -o /tmp/and-base
          for ratio in 16 32 64; do
            python3 experiments/and_gallop.py track-b/main.cpp "/tmp/and-$ratio.cpp" "$ratio"
            g++ -std=c++20 -O3 -DNDEBUG -pthread -Wall -Wextra "/tmp/and-$ratio.cpp" -o "/tmp/and-$ratio"
          done
          python3 tests/differential.py /tmp/and-32
      - name: Generate two full seeds and independent reference
        run: |
          set -euo pipefail
          for seed in 1 2; do
            python3 /tmp/sd-organizer/generators/b_index.py --seed "$seed" --scale full --out "/tmp/and-data-$seed"
          done
          mkdir -p /tmp/and-reference-2
          python3 /tmp/sd-organizer/reference/b_index.py --data /tmp/and-data-2 --out /tmp/and-reference-2
      - name: Interleaved exact full-scale comparisons
        run: |
          set -euo pipefail
          mkdir -p /tmp/and-output
          for seed in 1 2; do
            for repeat in 1 2; do
              for variant in base 16 32 64; do
                echo "AND_COMPARE seed=$seed repeat=$repeat variant=$variant"
                /usr/bin/time -f 'WALL_SECONDS=%e PEAK_RSS_KB=%M' \
                  "/tmp/and-$variant" --data "/tmp/and-data-$seed" --out /tmp/and-output
                if [ "$seed" = 1 ]; then
                  echo 'f86973c210228141bcb6f1f1b10188ad2a9b65f71e7cd7cf4590b38de4e80927  /tmp/and-output/results.txt' | sha256sum -c -
                else
                  cmp /tmp/and-output/results.txt /tmp/and-reference-2/results.txt
                fi
              done
            done
          done
