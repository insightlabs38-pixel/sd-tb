name: Track B exact dictionary cache comparison
on:
  push:
    branches: [main]
    paths: [.github/workflows/track-b-dict-cache.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: track-b-dict-cache
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Compile and differential-test exact alternatives
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/hackathon-raptors/speed-demon-2026.git /tmp/dc-organizer
          python3 -m py_compile experiments/dict_cache.py
          g++ -std=c++20 -O3 -flto -march=x86-64-v3 -DNDEBUG -pthread -Wall -Wextra track-b/main.cpp -o /tmp/dc-base
          for variant in fold cache both; do
            python3 experiments/dict_cache.py track-b/main.cpp "/tmp/dc-$variant.cpp" "$variant"
            g++ -std=c++20 -O3 -flto -march=x86-64-v3 -DNDEBUG -pthread -Wall -Wextra "/tmp/dc-$variant.cpp" -o "/tmp/dc-$variant"
            python3 tests/differential.py "/tmp/dc-$variant"
          done
      - name: Generate full datasets and independent second-seed oracle
        run: |
          set -euo pipefail
          for seed in 1 2; do
            python3 /tmp/dc-organizer/generators/b_index.py --seed "$seed" --scale full --out "/tmp/dc-data-$seed"
          done
          mkdir -p /tmp/dc-ref-2
          python3 /tmp/dc-organizer/reference/b_index.py --data /tmp/dc-data-2 --out /tmp/dc-ref-2
      - name: Two-seed interleaved exactness, wall time and RSS
        run: |
          set -euo pipefail
          mkdir -p /tmp/dc-out
          for seed in 1 2; do
            for repeat in 1 2 3; do
              if [ "$repeat" = 2 ]; then order="both cache fold base"; else order="base fold cache both"; fi
              for variant in $order; do
                echo "DICT_COMPARE seed=$seed repeat=$repeat variant=$variant"
                /usr/bin/time -f 'WALL_SECONDS=%e PEAK_RSS_KB=%M' "/tmp/dc-$variant" --data "/tmp/dc-data-$seed" --out /tmp/dc-out
                if [ "$seed" = 1 ]; then
                  echo 'f86973c210228141bcb6f1f1b10188ad2a9b65f71e7cd7cf4590b38de4e80927  /tmp/dc-out/results.txt' | sha256sum -c -
                else
                  cmp /tmp/dc-out/results.txt /tmp/dc-ref-2/results.txt
                fi
              done
            done
          done
      - name: Offline Docker exactness on the combined challenger
        run: |
          set -euo pipefail
          python3 /tmp/dc-organizer/generators/b_index.py --seed 1 --scale sample --out /tmp/dc-sample
          mkdir -p /tmp/dc-docker /tmp/dc-docker-out
          cp track-b/Dockerfile /tmp/dc-docker/Dockerfile
          cp /tmp/dc-both.cpp /tmp/dc-docker/main.cpp
          chmod 777 /tmp/dc-docker-out
          docker build --network=none -t sd-dict-cache:verify /tmp/dc-docker
          docker run --rm --user 65534:65534 --network=none --read-only \
            -v /tmp/dc-sample:/data:ro -v /tmp/dc-docker-out:/out:rw sd-dict-cache:verify
          echo 'eeeec1e9319da98a6f3c664c78f93e7078fd603c25c2bb3027174e81e3638a8f  /tmp/dc-docker-out/results.txt' | sha256sum -c -
