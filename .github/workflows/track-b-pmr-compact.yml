name: Track B PMR allocator qualification on compact tape
on:
  push:
    branches: [main]
    paths: [.github/workflows/track-b-pmr-compact.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: track-b-pmr-compact
  cancel-in-progress: true
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Build all variants and differential-test
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/hackathon-raptors/speed-demon-2026.git /tmp/pmr-organizer
          python3 experiments/pool_postings.py pool track-b/main.cpp /tmp/pmr-pool.cpp
          python3 experiments/pool_postings.py monotonic track-b/main.cpp /tmp/pmr-monotonic.cpp
          for variant in baseline pool monotonic; do
            src=track-b/main.cpp
            if [ "$variant" != baseline ]; then src="/tmp/pmr-$variant.cpp"; fi
            g++ -std=c++20 -O3 -flto -march=x86-64-v3 -DNDEBUG -pthread -Wall -Wextra "$src" -o "/tmp/pmr-$variant"
            python3 tests/differential.py "/tmp/pmr-$variant"
          done
      - name: Independent two-seed full oracle
        run: |
          set -euo pipefail
          for seed in 1 2; do
            python3 /tmp/pmr-organizer/generators/b_index.py --seed "$seed" --scale full --out "/tmp/pmr-data-$seed"
          done
          mkdir -p /tmp/pmr-ref-2
          python3 /tmp/pmr-organizer/reference/b_index.py --data /tmp/pmr-data-2 --out /tmp/pmr-ref-2
      - name: Interleaved three-pair timing, memory and exact output
        run: |
          set -euo pipefail
          mkdir -p /tmp/pmr-out
          for seed in 1 2; do
            for repeat in 1 2 3; do
              for variant in baseline pool monotonic; do
                echo "PMR_COMPACT seed=$seed repeat=$repeat variant=$variant"
                /usr/bin/time -f 'WALL_SECONDS=%e PEAK_RSS_KB=%M' "/tmp/pmr-$variant" --data "/tmp/pmr-data-$seed" --out /tmp/pmr-out
                if [ "$seed" = 1 ]; then
                  echo 'f86973c210228141bcb6f1f1b10188ad2a9b65f71e7cd7cf4590b38de4e80927  /tmp/pmr-out/results.txt' | sha256sum -c -
                else
                  cmp /tmp/pmr-out/results.txt /tmp/pmr-ref-2/results.txt
                fi
              done
            done
          done
      - name: Sanitizers and pinned offline Docker on both challengers
        run: |
          set -euo pipefail
          python3 /tmp/pmr-organizer/generators/b_index.py --seed 1 --scale tiny --out /tmp/pmr-tiny
          python3 /tmp/pmr-organizer/generators/b_index.py --seed 1 --scale sample --out /tmp/pmr-sample
          for variant in pool monotonic; do
            g++ -std=c++20 -O1 -g -march=x86-64-v3 -pthread -fsanitize=address,undefined -fno-omit-frame-pointer "/tmp/pmr-$variant.cpp" -o "/tmp/pmr-$variant-asan"
            mkdir -p "/tmp/pmr-$variant-asan-out" "/tmp/pmr-$variant-docker" "/tmp/pmr-$variant-docker-out"
            ASAN_OPTIONS=detect_leaks=1 "/tmp/pmr-$variant-asan" --data /tmp/pmr-tiny --out "/tmp/pmr-$variant-asan-out"
            cp track-b/Dockerfile "/tmp/pmr-$variant-docker/Dockerfile"
            cp "/tmp/pmr-$variant.cpp" "/tmp/pmr-$variant-docker/main.cpp"
            chmod 777 "/tmp/pmr-$variant-docker-out"
            docker build --network=none -t "sd-pmr-$variant:verify" "/tmp/pmr-$variant-docker"
            docker run --rm --user 65534:65534 --network=none --read-only \
              -v /tmp/pmr-sample:/data:ro -v "/tmp/pmr-$variant-docker-out:/out:rw" "sd-pmr-$variant:verify"
            echo "eeeec1e9319da98a6f3c664c78f93e7078fd603c25c2bb3027174e81e3638a8f  /tmp/pmr-$variant-docker-out/results.txt" | sha256sum -c -
          done
