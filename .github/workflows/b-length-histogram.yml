name: B full corpus exact length histogram
on:
  push:
    branches: ['research/b-breakthrough-20261101-length-histogram']
    paths:
      - 'experiments/breakthrough/length_histogram.cpp'
      - '.github/workflows/b-length-histogram.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Pin reference and compile complete instrumented engine
        run: |
          set -euo pipefail
          git clone https://github.com/hackathon-raptors/speed-demon-2026.git /tmp/organizer
          git -C /tmp/organizer checkout 3e365d15d9905a0d73c9f05207d434a654666d3c
          g++ -std=c++20 -O3 -flto -march=x86-64-v3 -DNDEBUG -pthread -Wall -Wextra experiments/breakthrough/length_histogram.cpp -o /tmp/b-hist
      - name: Independent randomized small-dataset exactness
        run: python3 tests/differential.py /tmp/b-hist
      - name: Generate official full corpus and capture exact workload statistics
        run: |
          set -euo pipefail
          python3 /tmp/organizer/generators/b_index.py --seed 1 --scale full --out /tmp/full-data
          mkdir -p /tmp/full-output
          /usr/bin/time -f 'COMPLETE_WALL=%e PEAK_RSS_KB=%M' /tmp/b-hist --data /tmp/full-data --out /tmp/full-output 2>&1 | tee /tmp/b-hist-stats.txt
          echo 'f86973c210228141bcb6f1f1b10188ad2a9b65f71e7cd7cf4590b38de4e80927  /tmp/full-output/results.txt' | sha256sum -c -
          git rev-parse HEAD >> /tmp/b-hist-stats.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b-length-histogram
          path: /tmp/b-hist-stats.txt
