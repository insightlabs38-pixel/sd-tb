name: Track B guarded-engine phase profile
on:
  push:
    branches: [track-b/phase-profile-15]
    paths: [.github/workflows/track-b-profile.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: track-b-phase-profile-15
  cancel-in-progress: true

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build temporary instrumented champion
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/hackathon-raptors/speed-demon-2026.git /tmp/profile-organizer
          git -C /tmp/profile-organizer fetch --depth 1 origin 9f059f75384607c7836997063b0901b98f36b5fa
          git -C /tmp/profile-organizer checkout 9f059f75384607c7836997063b0901b98f36b5fa
          python3 experiments/profile_phases.py track-b/main.cpp /tmp/profile-b.cpp
          g++ -std=c++20 -O3 -flto -march=x86-64-v3 -mtune=alderlake -DNDEBUG -pthread /tmp/profile-b.cpp -o /tmp/profile-b
          python3 tests/differential.py /tmp/profile-b
          python3 tests/frontier_adversarial.py /tmp/profile-b
      - name: Generate two complete organizer seeds
        run: |
          set -euo pipefail
          for seed in 1 2; do
            python3 /tmp/profile-organizer/generators/b_index.py --seed "$seed" --scale full --out "/tmp/profile-data-$seed"
          done
          python3 /tmp/profile-organizer/reference/b_index.py --data /tmp/profile-data-2 --out /tmp/profile-ref-2
      - name: Profile phases and sample scan stages, verify every result
        run: |
          set -euo pipefail
          mkdir -p /tmp/profile-out
          for seed in 1 2; do
            for repeat in 1 2 3; do
              echo "PROFILE_RUN seed=$seed repeat=$repeat"
              /usr/bin/time -f 'WALL_SECONDS=%e PEAK_RSS_KB=%M' \
                /tmp/profile-b --data "/tmp/profile-data-$seed" --out /tmp/profile-out
              if [ "$seed" = 1 ]; then
                echo 'f86973c210228141bcb6f1f1b10188ad2a9b65f71e7cd7cf4590b38de4e80927  /tmp/profile-out/results.txt' | sha256sum -c -
              else
                cmp /tmp/profile-out/results.txt /tmp/profile-ref-2/results.txt
              fi
            done
          done
