name: B breakthrough postings full solver qualification
on:
  push:
    branches:
      - research/b-breakthrough-20261101-postings
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-and-profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Get official generator and reference
        run: git clone --depth 1 https://github.com/hackathon-raptors/speed-demon-2026.git /tmp/organizer
      - name: Build existing champion and alternative
        run: |
          set -euo pipefail
          g++ -std=c++20 -O3 -msse4.2 -pthread -Wall -Wextra experiments/breakthrough/query_postings.cpp -o /tmp/b-postings
          g++ -std=c++20 -O3 -march=x86-64-v3 -mbmi2 -pthread track-b/main.cpp -o /tmp/b-champion
      - name: Differential and sanitizer tests
        run: |
          set -euo pipefail
          python3 tests/differential.py /tmp/b-postings
          python3 tests/frontier_adversarial.py /tmp/b-postings
          g++ -std=c++20 -O1 -g -msse4.2 -pthread -fsanitize=address,undefined -fno-omit-frame-pointer experiments/breakthrough/query_postings.cpp -o /tmp/b-postings-asan
          python3 /tmp/organizer/generators/b_index.py --seed 7 --scale tiny --out /tmp/tiny7
          mkdir -p /tmp/out7
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 /tmp/b-postings-asan --data /tmp/tiny7 --out /tmp/out7
          mkdir -p /tmp/ref7
          python3 /tmp/organizer/reference/b_index.py --data /tmp/tiny7 --out /tmp/ref7
          cmp /tmp/out7/results.txt /tmp/ref7/results.txt
      - name: End-to-end full seeds and phase breakdown
        run: |
          set -euo pipefail
          mkdir -p /tmp/ans
          for seed in 1 2 3; do
            python3 /tmp/organizer/generators/b_index.py --seed "$seed" --scale full --out "/tmp/full-$seed"
            if [ "$seed" != 1 ]; then
              mkdir -p "/tmp/py-$seed"
              python3 /tmp/organizer/reference/b_index.py --data "/tmp/full-$seed" --out "/tmp/py-$seed"
            fi
            for binary in postings champion; do
              for round in 1 2 3; do
                echo "MEASURE seed=$seed binary=$binary round=$round"
                B_PROFILE=1 /usr/bin/time -f 'WALL_SECONDS=%e PEAK_RSS_KB=%M' "/tmp/b-$binary" --data "/tmp/full-$seed" --out /tmp/ans
                if [ "$seed" = 1 ]; then
                  echo 'f86973c210228141bcb6f1f1b10188ad2a9b65f71e7cd7cf4590b38de4e80927  /tmp/ans/results.txt' | sha256sum -c -
                else
                  cmp /tmp/ans/results.txt "/tmp/py-$seed/results.txt"
                fi
              done
            done
          done
      - name: Verify offline Docker read-only root
        run: |
          set -euo pipefail
          mkdir -p /tmp/bdocker /tmp/bdocker-out
          cp track-b/Dockerfile /tmp/bdocker/Dockerfile
          cp experiments/breakthrough/query_postings.cpp /tmp/bdocker/main.cpp
          docker build --network=none -t b-postings-research /tmp/bdocker
          chmod 777 /tmp/bdocker-out
          docker run --rm --user 65534:65534 --network=none --read-only --memory=4g \
            -v /tmp/full-1:/data:ro -v /tmp/bdocker-out:/out:rw b-postings-research
          echo 'f86973c210228141bcb6f1f1b10188ad2a9b65f71e7cd7cf4590b38de4e80927  /tmp/bdocker-out/results.txt' | sha256sum -c -
