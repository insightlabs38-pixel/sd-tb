name: B breakthrough pinned Docker cgroup and K comparison
on:
  push:
    branches:
      - research/b-breakthrough-20261101-report
    paths:
      - .github/workflows/research-b-scoring.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  score:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pin organizer source and independent candidate SHAs
        run: |
          set -euo pipefail
          git clone https://github.com/hackathon-raptors/speed-demon-2026.git /tmp/organizer
          git -C /tmp/organizer checkout 7a9057bce3004c4120b01a480f51d8c0feaf74d7
          git fetch origin research/b-breakthrough-20261101-bloom-filter
          git fetch origin research/b-breakthrough-20261101-compact-bmi2
          git fetch origin research/b-breakthrough-20261101-compressed-exact
          mkdir -p /tmp/build/{champion,bloom,compressed/src,bmi2/src} /tmp/evidence /tmp/tools
          git show e0d67d08bb505c0839f0e01660f88132ce56b502:track-b/main.cpp > /tmp/build/champion/main.cpp
          git show e0d67d08bb505c0839f0e01660f88132ce56b502:track-b/Dockerfile > /tmp/build/champion/Dockerfile
          git show 2b0c95e8542ef29f3fdc47148d3e22214813b18c:experiments/breakthrough/bloom_gated.cpp > /tmp/build/bloom/main.cpp
          cp /tmp/build/champion/Dockerfile /tmp/build/bloom/Dockerfile
          git show 1bbc318f5e33efb3f230f419fa9311e3850bfa8e:experiments/breakthrough/compressed_exact.rs > /tmp/build/compressed/src/main.rs
          git show fd64e677304c90cf6c030020e84bf81f0a080025:experiments/breakthrough/compressed_exact.rs > /tmp/build/bmi2/src/main.rs
          for x in compressed bmi2; do
            git show 1bbc318f5e33efb3f230f419fa9311e3850bfa8e:experiments/breakthrough/compressed-Cargo.toml > /tmp/build/$x/Cargo.toml
            cat > /tmp/build/$x/Dockerfile <<'EOF'
          FROM rust:1-slim-trixie@sha256:1a939748a7cbab172de91a014e3804a97af1394a8c844faa67fce9401c4e40fb AS build
          WORKDIR /src
          COPY Cargo.toml .
          COPY src src
          RUN RUSTFLAGS="-C target-cpu=x86-64-v3" cargo build --release --offline
          FROM debian:13-slim@sha256:62bd423aeee912639ca8ee681c2b762cb3e25137e0a92b20be455898a9f034ad
          COPY --from=build /src/target/release/index /solution
          ENTRYPOINT ["/solution"]
          EOF
          done
      - name: Build pinned offline containers and timer
        run: |
          set -euo pipefail
          docker pull gcc:15@sha256:eb5e64286ad47187b32bda75c6b6916166ecb41da56559b8b09e0001748d2cce
          docker pull rust:1-slim-trixie@sha256:1a939748a7cbab172de91a014e3804a97af1394a8c844faa67fce9401c4e40fb
          docker pull debian:13-slim@sha256:62bd423aeee912639ca8ee681c2b762cb3e25137e0a92b20be455898a9f034ad
          gcc -O2 -static /tmp/organizer/harness/timer/sd-timer.c -o /tmp/tools/sd-timer
          for x in champion bloom compressed bmi2; do
            docker build --network=none -t b-score:$x /tmp/build/$x
          done
      - name: Full independent seeds cgroup and exact output, paired
        run: |
          set -euo pipefail
          for seed in 1 2 3; do
            python3 /tmp/organizer/generators/b_index.py --seed "$seed" --scale full --out "/tmp/full-$seed"
            if [ "$seed" = 1 ]; then expected=f86973c210228141bcb6f1f1b10188ad2a9b65f71e7cd7cf4590b38de4e80927
            else
              mkdir -p "/tmp/ref-$seed"
              python3 /tmp/organizer/reference/b_index.py --data "/tmp/full-$seed" --out "/tmp/ref-$seed"
              expected=$(sha256sum "/tmp/ref-$seed/results.txt" | cut -d' ' -f1)
            fi
            sudo python3 experiments/frontier/compare.py \
              --data "/tmp/full-$seed" --expected "$expected" --timer /tmp/tools/sd-timer \
              --seed "$seed" --repeat 3 --results /tmp/evidence/measurements.jsonl \
              b-score:champion b-score:bloom b-score:compressed b-score:bmi2
          done
      - name: Canonical source count and K ratios
        run: |
          set -euo pipefail
          python3 -m pip install clang-format==23.1.3
          curl -fL https://github.com/boyter/scc/releases/download/v4.1.0/scc_Linux_x86_64.tar.gz -o /tmp/scc.tar.gz
          echo 'c7328436d3027f4357d3d7853f7dc3ac2bbcb4ca08f1adad91a27c593884079b  /tmp/scc.tar.gz' | sha256sum -c -
          tar -xzf /tmp/scc.tar.gz -C /tmp/tools scc
          for x in champion bloom compressed bmi2; do
            mkdir -p "/tmp/count-$x"
            cp "/tmp/build/$x/Dockerfile" "/tmp/count-$x/Dockerfile"
            if [ "$x" = champion ] || [ "$x" = bloom ]; then
              clang-format --style=LLVM "/tmp/build/$x/main.cpp" > "/tmp/count-$x/main.cpp"
            else
              rustfmt --edition 2021 --emit stdout "/tmp/build/$x/src/main.rs" > "/tmp/count-$x/main.rs"
              cp "/tmp/build/$x/Cargo.toml" "/tmp/count-$x/Cargo.toml"
            fi
            /tmp/tools/scc --format json "/tmp/count-$x" > "/tmp/evidence/static-$x.json"
          done
          python3 - <<'PY'
          import json,statistics,sys
          from pathlib import Path
          sys.path.insert(0, "/tmp/organizer/harness")
          from scoring import k_from_measurements
          root=Path("/tmp/evidence")
          cal=json.loads(Path("/tmp/organizer/harness/calibration-seed1.json").read_text())["tracks"]["b"]
          ref=dict(T=cal["T_ref_s"],M=cal["M_ref_bytes"],S=91,D=1)
          runs=[json.loads(x) for x in (root/"measurements.jsonl").read_text().splitlines()]
          summary=[]
          for seed in (1,2,3):
              for x in ("champion","bloom","compressed","bmi2"):
                  sel=[r for r in runs if r["seed"]==seed and r["image"]=="b-score:"+x]
                  static=json.loads((root/("static-"+x+".json")).read_text())
                  axes=dict(T=statistics.median(r["T"] for r in sel),
                            M=max(r["M"] for r in sel),
                            S=sum(t["Code"] for t in static),D=1)
                  k=k_from_measurements(ref,axes)
                  row=dict(seed=seed,name=x,K_runner=k,**axes)
                  print(json.dumps(row));summary.append(row)
          (root/"summary.json").write_text(json.dumps(summary,indent=2)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b-breakthrough-cgroup-k-receipts
          path: /tmp/evidence/
