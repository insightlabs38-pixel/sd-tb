name: B breakthrough tiered lexicon end-to-end qualification
on:
  push:
    branches: ['research/b-breakthrough-20261101-tiered-lexicon']
    paths: ['experiments/breakthrough/tiered_lexicon.cpp', '.github/workflows/b-tiered-lexicon.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: b-tiered-lexicon
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Immutable baseline, pinned builds and organizer
        run: |
          set -euo pipefail
          mkdir -p /tmp/btier/evidence /tmp/btier/bin
          git clone https://github.com/hackathon-raptors/speed-demon-2026.git /tmp/btier/organizer
          git -C /tmp/btier/organizer checkout 3e365d15d9905a0d73c9f05207d434a654666d3c
          cp track-b/main.cpp /tmp/btier/base.cpp
          git rev-parse HEAD > /tmp/btier/evidence/ci-head.txt
          for variant in base hot9 hot10 hot11 hot12; do
            mkdir -p "/tmp/btier/$variant"
            cp track-b/Dockerfile "/tmp/btier/$variant/Dockerfile"
            if [ "$variant" = base ]; then
              cp /tmp/btier/base.cpp "/tmp/btier/$variant/main.cpp"
            else
              bits=${variant#hot}
              sed "s/#define HOT_DICT_BITS 10/#define HOT_DICT_BITS $bits/" experiments/breakthrough/tiered_lexicon.cpp > "/tmp/btier/$variant/main.cpp"
            fi
            g++ -std=c++20 -O3 -flto -march=x86-64-v3 -DNDEBUG -pthread -Wall -Wextra "/tmp/btier/$variant/main.cpp" -o "/tmp/btier/bin/$variant"
            docker build --network=none -t "b-tier:$variant" "/tmp/btier/$variant"
          done
          gcc -O2 -static /tmp/btier/organizer/harness/timer/sd-timer.c -o /tmp/btier/bin/sd-timer
      - name: Strict differential, adversarial, sanitizers
        run: |
          set -euo pipefail
          for variant in hot9 hot10 hot11 hot12; do
            python3 tests/differential.py "/tmp/btier/bin/$variant"
            python3 tests/frontier_adversarial.py "/tmp/btier/bin/$variant"
          done
          g++ -std=c++20 -O1 -g -march=x86-64-v3 -pthread -fsanitize=address,undefined -fno-omit-frame-pointer -fno-pie -no-pie /tmp/btier/hot10/main.cpp -o /tmp/btier/bin/asan
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 python3 tests/differential.py /tmp/btier/bin/asan
          ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 python3 tests/frontier_adversarial.py /tmp/btier/bin/asan
          g++ -std=c++20 -O1 -g -march=x86-64-v3 -pthread -fsanitize=thread -fno-omit-frame-pointer -fno-pie -no-pie /tmp/btier/hot10/main.cpp -o /tmp/btier/bin/tsan
          TSAN_OPTIONS=halt_on_error=1 python3 tests/frontier_adversarial.py /tmp/btier/bin/tsan
      - name: Generate exact full-seed references
        run: |
          set -euo pipefail
          python3 /tmp/btier/organizer/generators/b_index.py --seed 1 --scale sample --out /tmp/btier/sample
          for seed in 1 2 3; do
            python3 /tmp/btier/organizer/generators/b_index.py --seed "$seed" --scale full --out "/tmp/btier/data-$seed"
            if [ "$seed" != 1 ]; then
              python3 /tmp/btier/organizer/reference/b_index.py --data "/tmp/btier/data-$seed" --out "/tmp/btier/reference-$seed"
            fi
          done
          mkdir -p /tmp/btier/sample-out
          /tmp/btier/bin/hot10 --data /tmp/btier/sample --out /tmp/btier/sample-out
          echo 'eeeec1e9319da98a6f3c664c78f93e7078fd603c25c2bb3027174e81e3638a8f  /tmp/btier/sample-out/results.txt' | sha256sum -c -
      - name: Paired pinned Docker measurements of full exact solver
        run: |
          set -euo pipefail
          for seed in 1 2 3; do
            if [ "$seed" = 1 ]; then
              expected=f86973c210228141bcb6f1f1b10188ad2a9b65f71e7cd7cf4590b38de4e80927
            else
              expected=$(sha256sum "/tmp/btier/reference-$seed/results.txt" | cut -d' ' -f1)
            fi
            sudo python3 experiments/frontier/compare.py --data "/tmp/btier/data-$seed" --expected "$expected" --timer /tmp/btier/bin/sd-timer --seed "$seed" --repeat 4 --results /tmp/btier/evidence/paired.jsonl b-tier:base b-tier:hot9 b-tier:hot10 b-tier:hot11 b-tier:hot12
          done
      - name: Report paired latency, exact peak cgroup and source
        if: always()
        run: |
          python3 - <<'PY'
          import json,statistics
          from collections import defaultdict
          from pathlib import Path
          p=Path('/tmp/btier/evidence/paired.jsonl')
          if not p.exists(): exit(0)
          rows=[json.loads(x) for x in p.read_text().splitlines()]
          g=defaultdict(list)
          for r in rows: g[(r['seed'],r['image'])].append(r)
          out=[]
          for (seed,img),v in sorted(g.items()):
            z=dict(seed=seed,image=img,median_seconds=statistics.median(x['T'] for x in v),
                   peak_bytes=max(x['M'] for x in v),n=len(v))
            out.append(z)
            print(json.dumps(z))
          Path('/tmp/btier/evidence/summary.json').write_text(json.dumps(out,indent=2))
          PY
          git rev-parse HEAD > /tmp/btier/evidence/commit.txt
          wc -l experiments/breakthrough/tiered_lexicon.cpp /tmp/btier/base.cpp > /tmp/btier/evidence/lines.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b-tiered-lexicon-evidence
          path: /tmp/btier/evidence/
