name: Track B combined challenger
on:
  push:
    branches: [track-b/flat-anchor-combined]
    paths: [.github/workflows/track-b-combined.yml]
permissions:
  contents: read
  statuses: write
concurrency:
  group: track-b-combined
  cancel-in-progress: true
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compile flat champion and combined challenger
        run: |
          git show 2725fc757476a7b5a54f669c2b9d46d6b6327df6:track-b/main.cpp > /tmp/flat.cpp
          g++ -std=c++20 -O3 -DNDEBUG -Wall -Wextra -pedantic /tmp/flat.cpp -o /tmp/flat
          g++ -std=c++20 -O3 -DNDEBUG -Wall -Wextra -pedantic track-b/main.cpp -o /tmp/combined
      - name: Randomized differential and Docker exactness
        run: |
          git clone --depth 1 https://github.com/hackathon-raptors/speed-demon-2026.git /tmp/sd-organizer
          python3 tests/differential.py /tmp/combined
          python3 /tmp/sd-organizer/generators/b_index.py --seed 2 --scale sample --out /tmp/sd-sample-2
          mkdir -p /tmp/sample-ref /tmp/sample-fast
          python3 /tmp/sd-organizer/reference/b_index.py --data /tmp/sd-sample-2 --out /tmp/sample-ref
          /tmp/combined --data /tmp/sd-sample-2 --out /tmp/sample-fast
          cmp /tmp/sample-ref/results.txt /tmp/sample-fast/results.txt
          docker build --network=none -t sd-b-combined:verify ./track-b
          mkdir -p /tmp/docker-out
          chmod 777 /tmp/docker-out
          docker run --rm --user 65534:65534 --network=none --read-only \
            -v /tmp/sd-sample-2:/data:ro -v /tmp/docker-out:/out:rw sd-b-combined:verify
          cmp /tmp/sample-ref/results.txt /tmp/docker-out/results.txt
      - name: Paired full-seed exactness and wall/RSS
        run: |
          mkdir -p /tmp/compare-out /tmp/full-ref-2
          for seed in 1 2; do
            python3 /tmp/sd-organizer/generators/b_index.py --seed "$seed" --scale full --out "/tmp/sd-full-$seed"
            if [ "$seed" = 2 ]; then
              python3 /tmp/sd-organizer/reference/b_index.py --data "/tmp/sd-full-$seed" --out /tmp/full-ref-2
            fi
            for repeat in 1 2; do
              for candidate in flat combined; do
                echo "BENCHMARK seed=$seed candidate=$candidate repeat=$repeat"
                /usr/bin/time -f 'WALL_SECONDS=%e PEAK_RSS_KB=%M' "/tmp/$candidate" --data "/tmp/sd-full-$seed" --out /tmp/compare-out
                if [ "$seed" = 1 ]; then
                  echo 'f86973c210228141bcb6f1f1b10188ad2a9b65f71e7cd7cf4590b38de4e80927  /tmp/compare-out/results.txt' | sha256sum -c -
                else
                  cmp /tmp/full-ref-2/results.txt /tmp/compare-out/results.txt
                fi
              done
            done
          done
      - name: Publish result
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then state=success; else state=failure; fi
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -d "{\"state\":\"$state\",\"context\":\"track-b/combined\",\"description\":\"Combined Boolean-anchor two-full-seed oracle and Docker\",\"target_url\":\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}"
