name: Track B segmented tape qualification
on:
  push:
    branches: [main]
    paths: [.github/workflows/track-b-segmented.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: track-b-segmented
  cancel-in-progress: true
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Compile and differential-test segmented challenger
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/hackathon-raptors/speed-demon-2026.git /tmp/seg-organizer
          python3 -m py_compile experiments/segmented_tape.py
          python3 experiments/segmented_tape.py track-b/main.cpp /tmp/seg-new.cpp
          g++ -std=c++20 -O3 -flto -march=x86-64-v3 -DNDEBUG -pthread -Wall -Wextra track-b/main.cpp -o /tmp/seg-base
          g++ -std=c++20 -O3 -flto -march=x86-64-v3 -DNDEBUG -pthread -Wall -Wextra /tmp/seg-new.cpp -o /tmp/seg-new
          python3 tests/differential.py /tmp/seg-new
      - name: Full-seed corpus and independent reference
        run: |
          set -euo pipefail
          for seed in 1 2; do
            python3 /tmp/seg-organizer/generators/b_index.py --seed "$seed" --scale full --out "/tmp/seg-data-$seed"
          done
          mkdir -p /tmp/seg-ref-2
          python3 /tmp/seg-organizer/reference/b_index.py --data /tmp/seg-data-2 --out /tmp/seg-ref-2
      - name: Paired full-seed correctness and performance
        run: |
          set -euo pipefail
          mkdir -p /tmp/seg-out
          for seed in 1 2; do
            for repeat in 1 2 3; do
              for variant in base new; do
                echo "SEG_COMPARE seed=$seed repeat=$repeat variant=$variant"
                /usr/bin/time -f 'WALL_SECONDS=%e PEAK_RSS_KB=%M'                   "/tmp/seg-$variant" --data "/tmp/seg-data-$seed" --out /tmp/seg-out
                if [ "$seed" = 1 ]; then
                  echo 'f86973c210228141bcb6f1f1b10188ad2a9b65f71e7cd7cf4590b38de4e80927  /tmp/seg-out/results.txt' | sha256sum -c -
                else
                  cmp /tmp/seg-out/results.txt /tmp/seg-ref-2/results.txt
                fi
              done
            done
          done
      - name: Pinned offline Docker as unprivileged user
        run: |
          set -euo pipefail
          python3 /tmp/seg-organizer/generators/b_index.py --seed 1 --scale sample --out /tmp/seg-sample
          mkdir -p /tmp/seg-docker /tmp/seg-docker-out
          chmod 777 /tmp/seg-docker-out
          cp track-b/Dockerfile /tmp/seg-docker/Dockerfile
          cp /tmp/seg-new.cpp /tmp/seg-docker/main.cpp
          docker build --network=none -t sd-seg:verify /tmp/seg-docker
          docker run --rm --user 65534:65534 --network=none --read-only             -v /tmp/seg-sample:/data:ro -v /tmp/seg-docker-out:/out:rw sd-seg:verify
          echo 'eeeec1e9319da98a6f3c664c78f93e7078fd603c25c2bb3027174e81e3638a8f  /tmp/seg-docker-out/results.txt' | sha256sum -c -
