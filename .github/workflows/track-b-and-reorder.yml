name: Track B AND-only rarity-order qualification
on:
  push:
    branches: [track-b/and-only-reorder-11]
    paths: [track-b/main.cpp, .github/workflows/track-b-and-reorder.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: track-b-andreorder
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build pinned champion and challenger
        run: |
          set -euo pipefail
          git clone https://github.com/hackathon-raptors/speed-demon-2026.git /tmp/organizer
          git -C /tmp/organizer checkout 3e365d15d9905a0d73c9f05207d434a654666d3c
          docker pull gcc:15@sha256:eb5e64286ad47187b32bda75c6b6916166ecb41da56559b8b09e0001748d2cce
          docker pull debian:13-slim@sha256:62bd423aeee912639ca8ee681c2b762cb3e25137e0a92b20be455898a9f034ad
          mkdir -p /tmp/baseline /tmp/bin /tmp/evidence
          cp track-b/Dockerfile /tmp/baseline/
          git show 731ff43fa4031c36e302c79029e0c9037dceaaf4:track-b/main.cpp > /tmp/baseline/main.cpp
          docker build --network=none -t frontier:baseline /tmp/baseline
          docker build --network=none -t frontier:andreorder track-b
          gcc -O2 -static /tmp/organizer/harness/timer/sd-timer.c -o /tmp/bin/sd-timer
          g++ -std=c++20 -O3 -march=x86-64-v3 -pthread -Wall -Wextra -Werror track-b/main.cpp -o /tmp/bin/candidate
      - name: Differential, adversarial, and sanitizer gates
        run: |
          set -euo pipefail
          python3 tests/differential.py /tmp/bin/candidate
          python3 tests/frontier_adversarial.py /tmp/bin/candidate
          g++ -std=c++20 -O1 -g -march=x86-64-v3 -pthread -fsanitize=address,undefined -fno-omit-frame-pointer -fno-pie -no-pie track-b/main.cpp -o /tmp/bin/asan
          python3 tests/differential.py /tmp/bin/asan
          python3 tests/frontier_adversarial.py /tmp/bin/asan
          g++ -std=c++20 -O1 -g -march=x86-64-v3 -pthread -fsanitize=thread -fno-omit-frame-pointer -fno-pie -no-pie track-b/main.cpp -o /tmp/bin/tsan
          TSAN_OPTIONS=halt_on_error=1 python3 tests/frontier_adversarial.py /tmp/bin/tsan
      - name: Three independent full seeds and exact Docker timing
        run: |
          set -euo pipefail
          for seed in 1 2 3; do
            python3 /tmp/organizer/generators/b_index.py --seed "$seed" --scale full --out "/tmp/data-$seed"
            if [ "$seed" = 1 ]; then
              expected=f86973c210228141bcb6f1f1b10188ad2a9b65f71e7cd7cf4590b38de4e80927
            else
              python3 /tmp/organizer/reference/b_index.py --data "/tmp/data-$seed" --out "/tmp/ref-$seed"
              expected=$(sha256sum "/tmp/ref-$seed/results.txt" | cut -d' ' -f1)
            fi
            sudo python3 experiments/frontier/compare.py --data "/tmp/data-$seed" --expected "$expected" --timer /tmp/bin/sd-timer --seed "$seed" --repeat 5 --results /tmp/evidence/measurements.jsonl frontier:baseline frontier:andreorder
          done
      - name: Score full T M S D
        run: |
          set -euo pipefail
          python3 -m pip install clang-format==23.1.3
          curl -fL https://github.com/boyter/scc/releases/download/v4.1.0/scc_Linux_x86_64.tar.gz -o /tmp/scc.tar.gz
          echo 'c7328436d3027f4357d3d7853f7dc3ac2bbcb4ca08f1adad91a27c593884079b  /tmp/scc.tar.gz' | sha256sum -c -
          tar -xzf /tmp/scc.tar.gz -C /tmp/bin scc
          for variant in baseline andreorder; do
            mkdir -p "/tmp/count-$variant"
            if [ "$variant" = baseline ]; then source=/tmp/baseline/main.cpp; else source=track-b/main.cpp; fi
            clang-format --style=LLVM "$source" > "/tmp/count-$variant/main.cpp"
            cp track-b/Dockerfile "/tmp/count-$variant/"
            /tmp/bin/scc --format json "/tmp/count-$variant" > "/tmp/evidence/static-$variant.json"
          done
          python3 - <<'PY'
          import json, math, statistics, sys
          from pathlib import Path
          sys.path.insert(0, "/tmp/organizer/harness")
          from scoring import k_from_measurements
          root = Path("/tmp/evidence")
          rows = [json.loads(x) for x in (root / "measurements.jsonl").read_text().splitlines()]
          calibration = json.loads(Path("/tmp/organizer/harness/calibration-seed1.json").read_text())["tracks"]["b"]
          reference = dict(T=calibration["T_ref_s"], M=calibration["M_ref_bytes"], S=91, D=1)
          ratios = []
          for seed in (1, 2, 3):
              scores = {}
              for variant in ("baseline", "andreorder"):
                  selected = [x for x in rows if x["seed"] == seed and x["image"] == f"frontier:{variant}"]
                  assert len(selected) == 5
                  S = sum(x["Code"] for x in json.loads((root / f"static-{variant}.json").read_text()))
                  axes = dict(T=statistics.median(x["T"] for x in selected), M=max(x["M"] for x in selected), S=S, D=1)
                  scores[variant] = k_from_measurements(reference, axes)
                  print(json.dumps(dict(seed=seed, variant=variant, **axes, K_local=scores[variant])), flush=True)
              ratio = scores["andreorder"] / scores["baseline"]
              ratios.append(ratio)
              print(f"seed {seed}: K ratio {ratio:.8f}", flush=True)
          print(f"geometric mean K ratio {math.exp(statistics.mean(math.log(x) for x in ratios)):.8f}", flush=True)
          print("Runner-local estimates only; no official score claim.", flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: track-b-andreorder-evidence
          path: /tmp/evidence/
