name: Track B branchless ASCII production-flags repeat
on:
  push:
    branches: [main]
    paths: [.github/workflows/track-b-ascii.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: track-b-ascii
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build and differential-test ASCII challengers
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/hackathon-raptors/speed-demon-2026.git /tmp/sd-organizer
          g++ -std=c++20 -O3 -flto -march=x86-64-v3 -DNDEBUG -pthread -Wall -Wextra track-b/main.cpp -o /tmp/ascii-base
          for variant in token; do
            python3 experiments/branchless_ascii.py track-b/main.cpp "/tmp/ascii-$variant.cpp" "$variant"
            g++ -std=c++20 -O3 -flto -march=x86-64-v3 -DNDEBUG -pthread -Wall -Wextra "/tmp/ascii-$variant.cpp" -o "/tmp/ascii-$variant"
            python3 tests/differential.py "/tmp/ascii-$variant"
          done
      - name: Generate two full seeds and independent seed-2 reference
        run: |
          set -euo pipefail
          for seed in 1 2; do
            python3 /tmp/sd-organizer/generators/b_index.py --seed "$seed" --scale full --out "/tmp/ascii-data-$seed"
          done
          mkdir -p /tmp/ascii-ref-2
          python3 /tmp/sd-organizer/reference/b_index.py --data /tmp/ascii-data-2 --out /tmp/ascii-ref-2
      - name: Interleaved full-seed exactness and timings
        run: |
          set -euo pipefail
          mkdir -p /tmp/ascii-out
          for seed in 1 2; do
            for repeat in 1 2 3; do
              for variant in base token; do
                echo "ASCII_COMPARE seed=$seed repeat=$repeat variant=$variant"
                /usr/bin/time -f 'WALL_SECONDS=%e PEAK_RSS_KB=%M' \
                  "/tmp/ascii-$variant" --data "/tmp/ascii-data-$seed" --out /tmp/ascii-out
                if [ "$seed" = 1 ]; then
                  echo 'f86973c210228141bcb6f1f1b10188ad2a9b65f71e7cd7cf4590b38de4e80927  /tmp/ascii-out/results.txt' | sha256sum -c -
                else
                  cmp /tmp/ascii-out/results.txt /tmp/ascii-ref-2/results.txt
                fi
              done
            done
          done
      - name: Offline pinned Docker and unprivileged read-only-root sample
        run: |
          set -euo pipefail
          python3 /tmp/sd-organizer/generators/b_index.py --seed 1 --scale sample --out /tmp/ascii-sample
          mkdir -p /tmp/ascii-docker /tmp/ascii-docker-out
          cp track-b/Dockerfile /tmp/ascii-docker/Dockerfile
          cp /tmp/ascii-token.cpp /tmp/ascii-docker/main.cpp
          docker build --network=none -t sd-ascii-token:verify /tmp/ascii-docker
          chmod 777 /tmp/ascii-docker-out
          docker run --rm --user 65534:65534 --network=none --read-only \
            -v /tmp/ascii-sample:/data:ro -v /tmp/ascii-docker-out:/out:rw \
            sd-ascii-token:verify
          echo 'eeeec1e9319da98a6f3c664c78f93e7078fd603c25c2bb3027174e81e3638a8f  /tmp/ascii-docker-out/results.txt' | sha256sum -c -
