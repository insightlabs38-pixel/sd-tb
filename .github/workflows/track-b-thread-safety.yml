name: Track B parallel sanitizer qualification
# Requalify promoted parallel AC and query engine, 2026-10-30.
on:
  push:
    branches: [main]
    paths: [.github/workflows/track-b-thread-safety.yml]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: track-b-thread-safety
  cancel-in-progress: true

jobs:
  sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Publish pending qualification run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -d "{\"state\":\"pending\",\"context\":\"track-b/thread-safety\",\"description\":\"ASan, UBSan, TSan qualification running\",\"target_url\":\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}"
      - name: Compile sanitizer builds
        run: |
          set -euo pipefail
          g++ -std=c++20 -O1 -g -pthread -fsanitize=address,undefined -fno-omit-frame-pointer track-b/main.cpp -o /tmp/sd-asan
          g++ -std=c++20 -O1 -g -pthread -fsanitize=thread -fno-omit-frame-pointer track-b/main.cpp -o /tmp/sd-tsan
      - name: Generate public sample seed 1
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/hackathon-raptors/speed-demon-2026.git /tmp/sd-organizer
          python3 /tmp/sd-organizer/generators/b_index.py --seed 1 --scale sample --out /tmp/sd-sample
      - name: Run ASan and UBSan on parallel sample
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          set -euo pipefail
          mkdir -p /tmp/sd-asan-out
          /tmp/sd-asan --data /tmp/sd-sample --out /tmp/sd-asan-out
          echo 'eeeec1e9319da98a6f3c664c78f93e7078fd603c25c2bb3027174e81e3638a8f  /tmp/sd-asan-out/results.txt' | sha256sum -c -
      - name: Run TSan on parallel sample
        env:
          TSAN_OPTIONS: halt_on_error=1:report_signal_unsafe=0
        run: |
          set -euo pipefail
          mkdir -p /tmp/sd-tsan-out
          /tmp/sd-tsan --data /tmp/sd-sample --out /tmp/sd-tsan-out
          echo 'eeeec1e9319da98a6f3c664c78f93e7078fd603c25c2bb3027174e81e3638a8f  /tmp/sd-tsan-out/results.txt' | sha256sum -c -
      - name: Publish sanitizer qualification status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then state=success; else state=failure; fi
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -d "{\"state\":\"$state\",\"context\":\"track-b/thread-safety\",\"description\":\"ASan, UBSan, TSan parallel sample qualification\",\"target_url\":\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}"
