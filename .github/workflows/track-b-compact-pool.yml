name: Track B compact tape plus pooled postings
on:
  push:
    branches: [main]
    paths: [.github/workflows/track-b-compact-pool.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: track-b-compact-pool
  cancel-in-progress: true
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Compile and differential-test combined challenger
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/hackathon-raptors/speed-demon-2026.git /tmp/cp-organizer
          python3 experiments/pool_postings.py pool track-b/main.cpp /tmp/cp-new.cpp
          g++ -std=c++20 -O3 -flto -march=x86-64-v3 -DNDEBUG -pthread -Wall -Wextra track-b/main.cpp -o /tmp/cp-base
          g++ -std=c++20 -O3 -flto -march=x86-64-v3 -DNDEBUG -pthread -Wall -Wextra /tmp/cp-new.cpp -o /tmp/cp-new
          python3 tests/differential.py /tmp/cp-new
      - name: Full-seed corpus and independent reference
        run: |
          set -euo pipefail
          for seed in 1 2; do
            python3 /tmp/cp-organizer/generators/b_index.py --seed "$seed" --scale full --out "/tmp/cp-data-$seed"
          done
          mkdir -p /tmp/cp-ref-2
          python3 /tmp/cp-organizer/reference/b_index.py --data /tmp/cp-data-2 --out /tmp/cp-ref-2
      - name: Three paired full-seed comparisons
        run: |
          set -euo pipefail
          mkdir -p /tmp/cp-out
          for seed in 1 2; do
            for repeat in 1 2 3; do
              for variant in base new; do
                echo "CP_COMPARE seed=$seed repeat=$repeat variant=$variant"
                /usr/bin/time -f 'WALL_SECONDS=%e PEAK_RSS_KB=%M'                   "/tmp/cp-$variant" --data "/tmp/cp-data-$seed" --out /tmp/cp-out
                if [ "$seed" = 1 ]; then
                  echo 'f86973c210228141bcb6f1f1b10188ad2a9b65f71e7cd7cf4590b38de4e80927  /tmp/cp-out/results.txt' | sha256sum -c -
                else
                  cmp /tmp/cp-out/results.txt /tmp/cp-ref-2/results.txt
                fi
              done
            done
          done
      - name: Offline Docker, unprivileged sample hash
        run: |
          set -euo pipefail
          python3 /tmp/cp-organizer/generators/b_index.py --seed 1 --scale sample --out /tmp/cp-sample
          mkdir -p /tmp/cp-docker /tmp/cp-docker-out
          chmod 777 /tmp/cp-docker-out
          cp track-b/Dockerfile /tmp/cp-docker/Dockerfile
          cp /tmp/cp-new.cpp /tmp/cp-docker/main.cpp
          docker build --network=none -t sd-cp:verify /tmp/cp-docker
          docker run --rm --user 65534:65534 --network=none --read-only             -v /tmp/cp-sample:/data:ro -v /tmp/cp-docker-out:/out:rw sd-cp:verify
          echo 'eeeec1e9319da98a6f3c664c78f93e7078fd603c25c2bb3027174e81e3638a8f  /tmp/cp-docker-out/results.txt' | sha256sum -c -
