name: B prefix partition exact stage cost diagnosis
on:
  push:
    branches: ['research/b-breakthrough-20261101-prefix-partition-phase']
    paths: ['.github/workflows/b-prefix-stage.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Produce identical phase instrumentation in both complete engines
        run: |
          set -euo pipefail
          git clone https://github.com/hackathon-raptors/speed-demon-2026.git /tmp/org
          git -C /tmp/org checkout 3e365d15d9905a0d73c9f05207d434a654666d3c
          python3 - <<'PY'
          from pathlib import Path
          for label,src in [('base','track-b/main.cpp'),('prefix','experiments/breakthrough/prefix_partition.cpp')]:
            s=Path(src).read_text()
            s=s.replace('#include <algorithm>','#include <algorithm>'+chr(10)+'#include <chrono>')
            pairs=[
              ('    engine.parse(queries, qsize, workers.size());',
               '    auto t0=std::chrono::steady_clock::now(); engine.parse(queries,qsize,workers.size()); auto t1=std::chrono::steady_clock::now();'),
              ('    engine.plan(docs, dsize);',
               '    engine.plan(docs,dsize); auto t2=std::chrono::steady_clock::now();'),
              ('    engine.planner.join();',
               '    engine.planner.join(); auto t3=std::chrono::steady_clock::now();'),
              ('    engine.write(out, workers);',
               '    engine.write(out,workers); auto t4=std::chrono::steady_clock::now(); auto ms=[](auto a,auto b){return std::chrono::duration<double,std::milli>(b-a).count();}; fprintf(stderr,"PHASE_MS parse=%.3f plan=%.3f scan=%.3f output=%.3f",ms(t0,t1),ms(t1,t2),ms(t2,t3),ms(t3,t4)); fputc(10,stderr);')
            ]
            for a,b in pairs:
              if a not in s: raise RuntimeError((label,a))
              s=s.replace(a,b)
            Path('/tmp/'+label+'-phase.cpp').write_text(s)
          PY
          for label in base prefix; do
            g++ -std=c++20 -O3 -flto -march=x86-64-v3 -DNDEBUG -pthread "/tmp/$label-phase.cpp" -o "/tmp/$label-phase"
          done
      - name: Warm identical official full corpus and compare 5 paired passes
        run: |
          set -euo pipefail
          python3 /tmp/org/generators/b_index.py --seed 1 --scale full --out /tmp/full
          mkdir -p /tmp/answer
          sha=f86973c210228141bcb6f1f1b10188ad2a9b65f71e7cd7cf4590b38de4e80927
          for repeat in 1 2 3 4 5; do
            for variant in base prefix; do
              echo "STAGE_COMPARE repeat=$repeat variant=$variant"
              /usr/bin/time -f 'WALL=%e RSS_KB=%M' "/tmp/$variant-phase" --data /tmp/full --out /tmp/answer
              echo "$sha  /tmp/answer/results.txt" | sha256sum -c -
            done
          done
